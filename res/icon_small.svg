<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- icon.svg simplified for 16-32 px: no rivets, rays, glow, sparkles or highlights; a thicker rim, a bigger pick and
       bolder notes. -->
