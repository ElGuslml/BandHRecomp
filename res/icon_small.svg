      <stop offset="0" stop-color="#f4f4f7"/>
      <stop offset="0.5" stop-color="#b3b3bb"/>
      <stop offset="1" stop-color="#5b5a63"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7ab9"/>
      <stop offset="0.55" stop-color="#ff3d9a"/>
      <stop offset="1" stop-color="#c41a6c"/>
    </linearGradient>
