    <g fill="#ffffff" stroke="#111013" stroke-width="7" stroke-linejoin="round" paint-order="stroke">
      <path d="M 109,84 L 169,71 L 169,140 A 17 13 -24 1 1 159,128 L 159,95 L 119,104 L 119,151 A 17 13 -24 1 1 109,139 Z"/>
